services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aischool
      POSTGRES_PASSWORD: aischool
      POSTGRES_DB: aischool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aischool -d aischool"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
