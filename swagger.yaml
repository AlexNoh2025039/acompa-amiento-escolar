            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/student/tutor/conversations/{conversationId}/messages:
      post:
        tags: [Tutor]
        summary: Enviar un mensaje o adjuntar una imagen/PDF al tutor
        description: Acepta texto de hasta 4000 caracteres y, opcionalmente, un archivo PDF/JPEG/PNG/WebP de hasta 10 MB.
        parameters:
          - $ref: '#/components/parameters/ConversationId'
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  content:
                    type: string
                    maxLength: 4000
                    example: ¿Me ayudas a entender este ejercicio?
                  file:
                    type: string
                    format: binary
              encoding:
                file:
                  contentType: application/pdf, image/jpeg, image/png, image/webp
        responses:
          '201':
            description: Mensaje del estudiante y respuesta del tutor guardados.
            content:
              application/json:
                example:
                  studentMessage:
                    id: cm7x1message003
                    role: student
                    content: ¿Me ayudas a entender este ejercicio?
                    createdAt: '2026-11-12T14:20:00.000Z'
                    attachment: null
                  assistantMessage:
                    id: cm7x1message004
                    role: assistant
                    content: Claro. Primero identifica qué información te da el problema.
                    createdAt: '2026-11-12T14:20:00.001Z'
                    attachment: null
                  expiresAt: '2026-12-12T14:20:00.000Z'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '413':
            $ref: '#/components/responses/PayloadTooLarge'
          '429':
            $ref: '#/components/responses/RateLimited'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/student/tutor/conversations/{conversationId}/messages/{messageId}/file:
      get:
        tags: [Tutor]
        summary: Descargar un adjunto enviado en un mensaje del tutor
        parameters:
          - $ref: '#/components/parameters/ConversationId'
          - $ref: '#/components/parameters/MessageId'
        responses:
          '200':
            description: Archivo privado adjunto al mensaje.
            content:
              application/octet-stream:
                schema:
                  type: string
                  format: binary
              application/pdf:
                schema:
                  type: string
                  format: binary
              image/jpeg:
                schema:
                  type: string
                  format: binary
              image/png:
                schema:
                  type: string
                  format: binary
              image/webp:
                schema:
                  type: string
                  format: binary
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

  components:
    securitySchemes:
      accessCookie:
        type: apiKey
        in: cookie
        name: access_token
        description: Cookie de acceso emitida por el registro o inicio de sesión.
      refreshCookie:
        type: apiKey
        in: cookie
        name: refresh_token
        description: Cookie de actualización emitida por el registro o inicio de sesión.
    parameters:
      ChildId:
        name: childId
        in: path
        required: true
        description: Identificador del perfil del hijo.
        schema:
          type: string
        example: cm7x1child001
      SubjectId:
        name: subjectId
        in: path
        required: true
        description: Identificador de la materia.
        schema:
          type: string
        example: cm7x1subject001
      ScheduleId:
        name: scheduleId
        in: path
        required: true
        description: Identificador del bloque de horario.
        schema:
          type: string
        example: cm7x1schedule001
      TaskId:
        name: taskId
        in: path
        required: true
        description: Identificador de la tarea.
        schema:
          type: string
        example: cm7x1task001
      AttachmentId:
        name: attachmentId
        in: path
        required: true
        description: Identificador del archivo adjunto.
        schema:
          type: string
        example: cm7x1attachment001
      ArtifactId:
        name: artifactId
        in: path
        required: true
        description: Identificador del material de aprendizaje.
        schema:
          type: string
        example: cm7x1artifact001
      ConversationId:
        name: conversationId
        in: path
        required: true
        description: Identificador de la conversación del tutor.
        schema:
          type: string
        example: cm7x1conversation001
      MessageId:
        name: messageId
        in: path
        required: true
        description: Identificador del mensaje.
        schema:
          type: string
        example: cm7x1message001
    schemas:
      ErrorResponse:
        type: object
        properties:
          error:
            type: object
            properties:
              code:
                type: string
                example: VALIDATION
              message:
                type: string
                example: Revisa los datos ingresados
              fields:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  email: [Ingresa un correo válido]
        required: [error]
      User:
        type: object
        properties:
          id:
            type: string
            example: cm7x1parent001
          fullName:
            type: string
            example: María López
          email:
            type: string
            format: email
            example: maria.lopez@example.com
          role:
            type: string
            enum: [parent, student]
            example: parent
          familyId:
            type: string
            example: cm7x1family001
        required: [id, fullName, email, role, familyId]
      Family:
        type: object
        properties:
          id:
            type: string
            example: cm7x1family001
          name:
            type: string
            nullable: true
            example: Familia de María López
      RegisterRequest:
        type: object
        required: [fullName, email, password, confirmPassword]
        properties:
          fullName:
            type: string
            minLength: 2
            maxLength: 120
            example: María López
          email:
            type: string
            format: email
            maxLength: 254
            example: maria.lopez@example.com
          password:
            type: string
            minLength: 8
            description: Debe incluir al menos una letra y un número.
            example: Escuela2026
          confirmPassword:
            type: string
            example: Escuela2026
      LoginRequest:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
            format: email
            example: maria.lopez@example.com
          password:
            type: string
            example: Escuela2026
      ForgotPasswordRequest:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            maxLength: 254
            example: maria.lopez@example.com
      ResetPasswordRequest:
        type: object
        required: [token, password, confirmPassword]
        properties:
          token:
            type: string
            minLength: 1
            example: token-de-restablecimiento-de-ejemplo
          password:
            type: string
            minLength: 8
            description: Debe incluir al menos una letra y un número.
            example: NuevaEscuela2026
          confirmPassword:
            type: string
            example: NuevaEscuela2026
      FamilyUpdateRequest:
        type: object
        required: [name]
        properties:
          name:
            type: string
            minLength: 2
            maxLength: 120
            example: Familia López
      ChildCreateRequest:
        type: object
        required: [fullName, birthDate, grade]
        properties:
          fullName:
            type: string
            minLength: 2
            maxLength: 120
            example: Sofía López
          birthDate:
            type: string
            format: date
            example: '2015-03-14'
          grade:
            type: string
            minLength: 1
            maxLength: 80
            example: 5.º grado
      ChildUpdateRequest:
        type: object
        minProperties: 1
        properties:
          fullName:
            type: string
            minLength: 2
            maxLength: 120
            example: Sofía María López
          birthDate:
            type: string
            format: date
            example: '2015-03-14'
          grade:
            type: string
            minLength: 1
            maxLength: 80
            example: 6.º grado
      StudentAccountRequest:
        type: object
        required: [email, password, confirmPassword]
        properties:
          email:
            type: string
            format: email
            maxLength: 254
            example: sofia.lopez@example.com
          password:
            type: string
            minLength: 8
            description: Debe incluir al menos una letra y un número.
            example: Alumna2026
          confirmPassword:
            type: string
            example: Alumna2026
      SubjectRequest:
        type: object
        required: [name]
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 80
            example: Ciencias
      ScheduleRequest:
        type: object
        required: [dayOfWeek, startTime, endTime]
        properties:
          subjectId:
            type: string
            nullable: true
            example: cm7x1subject001
          dayOfWeek:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
            example: monday
          startTime:
            type: string
            pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
            example: '16:00'
          endTime:
            type: string
            pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
            example: '17:00'
      TaskCreateRequest:
        type: object
        required: [title, type]
        properties:
          subjectId:
            type: string
            nullable: true
            example: cm7x1subject001
          title:
            type: string
            minLength: 1
            maxLength: 180
            example: Lectura de ciencias
          description:
            type: string
            nullable: true
            maxLength: 10000
            example: Leer el capítulo sobre los ecosistemas.
          type:
            type: string
            enum: [homework, exam, reading]
            example: reading
          createQuiz:
            type: boolean
            description: Si es true, solicita generar un cuestionario; requiere materia.
            example: true
          dueAt:
            type: string
            format: date-time
            nullable: true
            example: '2026-11-20T23:59:00.000Z'
          status:
            type: string
            enum: [pending, in_progress, completed]
            example: pending
      TaskUpdateRequest:
        type: object
        minProperties: 1
        properties:
          subjectId:
            type: string
            nullable: true
            example: cm7x1subject001
          title:
            type: string
            minLength: 1
            maxLength: 180
            example: Lectura de ecosistemas
          description:
            type: string
            nullable: true
            maxLength: 10000
            example: Leer el capítulo 3.
          type:
            type: string
            enum: [homework, exam, reading]
            example: homework
          dueAt:
            type: string
            format: date-time
            nullable: true
            example: '2026-11-21T23:59:00.000Z'
          status:
            type: string
            enum: [pending, in_progress, completed]
            example: in_progress
      NotificationPreferencesRequest:
        type: object
        required: [emailSummary, reminderTime]
        properties:
          emailSummary:
            type: boolean
            example: true
          reminderTime:
            type: string
            nullable: true
            pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
            example: '18:30'
      TaskStatusRequest:
        type: object
        required: [status]
        properties:
          status:
            type: string
            enum: [pending, in_progress, completed]
            example: in_progress
      LearningArtifactRequest:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [summary, practice, podcast, video]
            example: summary
          attachmentId:
            type: string
            minLength: 1
            example: cm7x1attachment001
      PracticeSubmitRequest:
        type: object
        required: [token, answers]
        properties:
          token:
            type: string
            minLength: 1
            description: Token de práctica devuelto por `/api/student/practice/start`.
            example: eyJhbGciOiJIUzI1NiJ9.ejE...
          answers:
            type: array
            minItems: 1
            maxItems: 5
            items:
              type: integer
              minimum: 0
              maximum: 3
            example: [0, 2, 1, 3, 0]
      TutorConversationRequest:
        type: object
        required: [subjectId]
        properties:
          subjectId:
            type: string
            minLength: 1
            example: cm7x1subject001
    responses:
      BadRequest:
        description: Solicitud inválida, datos no válidos o archivo no aceptado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: VALIDATION
                message: Revisa los datos ingresados
                fields:
                  email: [Ingresa un correo válido]
      Unauthorized:
        description: Falta una sesión válida o las credenciales/token no son válidos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: UNAUTHORIZED
                message: Inicia sesión para continuar
      Forbidden:
        description: El usuario autenticado no tiene permiso para esta operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: FORBIDDEN
                message: No tienes permiso para esta acción
      NotFound:
        description: No se encontró el recurso solicitado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: NOT_FOUND
                message: No encontramos el recurso solicitado
      Conflict:
        description: La operación entra en conflicto con el estado actual del recurso.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: CONFLICT
                message: La operación no se puede completar en el estado actual
      RateLimited:
        description: Se superó el límite temporal de solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: RATE_LIMITED
                message: Demasiados intentos. Espera un momento.
      PayloadTooLarge:
        description: El archivo excede el límite de 10 MB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: FILE_TOO_LARGE
                message: El archivo supera el límite de 10 MB
      ServiceUnavailable:
        description: El servicio de correo u otro servicio requerido no está configurado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: EMAIL_NOT_CONFIGURED
                message: El servicio de correo no está configurado
      InternalServerError:
        description: Error inesperado del servidor.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              error:
                code: INTERNAL
                message: Ocurrió un error inesperado
