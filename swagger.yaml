  openapi: 3.0.0
  info:
    title: API de Acompañamiento Escolar
    version: 1.0.0
    description: |
      Documentación de las rutas HTTP registradas por el backend.
      Las rutas requieren la cookie `access_token` excepto las marcadas como públicas.
      Las cargas de archivos se envían como `multipart/form-data`; el campo del archivo es `file`
      y el tamaño máximo admitido es 10 MB. No se definen parámetros de consulta.
  servers:
    - url: http://localhost:3001
      description: Backend local (puerto predeterminado)
  tags:
    - name: Salud
    - name: Autenticación
    - name: Familias
    - name: Hijos
    - name: Materias
    - name: Horarios
    - name: Tareas
    - name: Materiales de aprendizaje
    - name: Estudiantes
    - name: Prácticas
    - name: Tutor
  security:
    - accessCookie: []
  paths:
    /api/health:
      get:
        tags: [Salud]
        summary: Comprobar disponibilidad del API
        security: []
        responses:
          '200':
            description: El servidor está activo.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    ok:
                      type: boolean
                      example: true
                example:
                  ok: true
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/auth/register:
      post:
        tags: [Autenticación]
        summary: Registrar una cuenta de padre o encargado
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRequest'
              example:
                fullName: María López
                email: maria.lopez@example.com
                password: Escuela2026
                confirmPassword: Escuela2026
        responses:
          '201':
            description: Cuenta y familia creadas. También establece las cookies de sesión.
            headers:
              Set-Cookie:
                description: Incluye `access_token` y `refresh_token` como cookies HttpOnly.
                schema:
                  type: string
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/User'
                example:
                  user:
                    id: cm7x1parent001
                    fullName: María López
                    email: maria.lopez@example.com
                    role: parent
                    familyId: cm7x1family001
          '400':
            $ref: '#/components/responses/BadRequest'
          '409':
            $ref: '#/components/responses/Conflict'
          '429':
            $ref: '#/components/responses/RateLimited'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/auth/login:
      post:
        tags: [Autenticación]
        summary: Iniciar sesión
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRequest'
              example:
                email: maria.lopez@example.com
                password: Escuela2026
        responses:
          '200':
            description: Inicio de sesión correcto. Establece cookies de sesión.
            headers:
              Set-Cookie:
                description: Incluye `access_token` y `refresh_token` como cookies HttpOnly.
                schema:
                  type: string
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/User'
                example:
                  user:
                    id: cm7x1parent001
                    fullName: María López
                    email: maria.lopez@example.com
                    role: parent
                    familyId: cm7x1family001
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '429':
            $ref: '#/components/responses/RateLimited'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/auth/refresh:
      post:
        tags: [Autenticación]
        summary: Renovar la sesión usando la cookie de actualización
        security:
          - refreshCookie: []
        responses:
          '200':
            description: Sesión renovada; se envían nuevas cookies.
            headers:
              Set-Cookie:
                description: Nuevas cookies `access_token` y `refresh_token`.
                schema:
                  type: string
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/User'
                example:
                  user:
                    id: cm7x1parent001
                    fullName: María López
                    email: maria.lopez@example.com
                    role: parent
                    familyId: cm7x1family001
          '401':
            $ref: '#/components/responses/Unauthorized'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/auth/logout:
      post:
        tags: [Autenticación]
        summary: Cerrar sesión y revocar la cookie de actualización
        security:
          - refreshCookie: []
        responses:
          '204':
            description: Sesión cerrada y cookies eliminadas.
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/auth/me:
      get:
        tags: [Autenticación]
        summary: Obtener los datos del usuario autenticado
        responses:
          '200':
            description: Datos públicos de la cuenta actual.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/User'
                example:
                  user:
                    id: cm7x1parent001
                    fullName: María López
                    email: maria.lopez@example.com
                    role: parent
                    familyId: cm7x1family001
          '401':
            $ref: '#/components/responses/Unauthorized'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/auth/forgot-password:
      post:
        tags: [Autenticación]
        summary: Solicitar un correo para restablecer la contraseña
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordRequest'
              example:
                email: maria.lopez@example.com
        responses:
          '202':
            description: Solicitud aceptada. El mensaje no revela si el correo está registrado.
            content:
              application/json:
                example:
                  message: Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña.
          '400':
            $ref: '#/components/responses/BadRequest'
          '429':
            $ref: '#/components/responses/RateLimited'
          '500':
            $ref: '#/components/responses/InternalServerError'
          '503':
            $ref: '#/components/responses/ServiceUnavailable'

    /api/auth/reset-password:
      post:
        tags: [Autenticación]
        summary: Establecer una contraseña nueva usando un token de un solo uso
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordRequest'
              example:
                token: token-de-restablecimiento-de-ejemplo
                password: NuevaEscuela2026
                confirmPassword: NuevaEscuela2026
        responses:
          '204':
            description: Contraseña actualizada; sesiones anteriores revocadas.
          '400':
            $ref: '#/components/responses/BadRequest'
          '429':
            $ref: '#/components/responses/RateLimited'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me:
      get:
        tags: [Familias]
        summary: Obtener la familia asociada a la sesión
        responses:
          '200':
            description: Familia del usuario actual.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    family:
                      $ref: '#/components/schemas/Family'
                example:
                  family:
                    id: cm7x1family001
                    name: Familia de María López
          '401':
            $ref: '#/components/responses/Unauthorized'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
      put:
        tags: [Familias]
        summary: Cambiar el nombre de la familia
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyUpdateRequest'
              example:
                name: Familia López
        responses:
          '200':
            description: Familia actualizada.
            content:
              application/json:
                example:
                  family:
                    id: cm7x1family001
                    name: Familia López
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '500':
            $ref: '#/components/responses/InternalServerError'
      delete:
        tags: [Familias]
        summary: Eliminar la familia y sus datos asociados
        description: Puede responder 202 si algunos archivos privados siguen pendientes de eliminación.
        responses:
          '202':
            description: Cuenta eliminada; hay archivos pendientes de borrado.
            content:
              application/json:
                example:
                  message: La cuenta se eliminó. Algunos archivos privados siguen en cola de borrado y se volverán a intentar automáticamente.
          '204':
            description: Familia eliminada correctamente.
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/overview:
      get:
        tags: [Familias]
        summary: Obtener el resumen familiar y el progreso de los hijos
        responses:
          '200':
            description: Resumen de tareas, evaluaciones, puntos y progreso por hijo.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    family:
                      $ref: '#/components/schemas/Family'
                    children:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChildOverview'
                example:
                  family:
                    id: cm7x1family001
                    name: Familia de María López
                  children:
                    - id: cm7x1child001
                      fullName: Sofía López
                      grade: 5.º grado
                      tasks:
                        pending: 2
                        inProgress: 1
                        completed: 4
                      nextTask:
                        title: Lectura de ciencias
                        dueAt: '2026-11-20T23:59:00.000Z'
                      averageScore: 86.5
                      evaluationCount: 2
                      points: 45
                      subjectAverages:
                        - name: Ciencias
                          averageScore: 86.5
                          evaluationCount: 2
                      gradeHistory: []
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children:
      get:
        tags: [Hijos]
        summary: Listar los perfiles de hijos de la familia
        responses:
          '200':
            description: Perfiles con materias asignadas y cuenta vinculada, si existe.
            content:
              application/json:
                example:
                  children:
                    - id: cm7x1child001
                      fullName: Sofía López
                      birthDate: '2015-03-14T00:00:00.000Z'
                      grade: 5.º grado
                      subjects:
                        - id: cm7x1subject001
                          name: Ciencias
                      user:
                        id: cm7x1student001
                        email: sofia.lopez@example.com
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '500':
            $ref: '#/components/responses/InternalServerError'
      post:
        tags: [Hijos]
        summary: Crear un perfil de hijo
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildCreateRequest'
              example:
                fullName: Sofía López
                birthDate: '2015-03-14'
                grade: 5.º grado
        responses:
          '201':
            description: Perfil creado.
            content:
              application/json:
                example:
                  child:
                    id: cm7x1child001
                    fullName: Sofía López
                    birthDate: '2015-03-14T00:00:00.000Z'
                    grade: 5.º grado
                    subjects: []
                    user: null
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}/account:
      post:
        tags: [Hijos, Autenticación]
        summary: Crear una cuenta de estudiante para un perfil existente
        parameters:
          - $ref: '#/components/parameters/ChildId'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccountRequest'
              example:
                email: sofia.lopez@example.com
                password: Alumna2026
                confirmPassword: Alumna2026
        responses:
          '201':
            description: Cuenta de estudiante creada y vinculada al perfil.
            content:
              application/json:
                example:
                  student:
                    id: cm7x1student001
                    fullName: Sofía López
                    email: sofia.lopez@example.com
                    role: student
                    familyId: cm7x1family001
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '409':
            $ref: '#/components/responses/Conflict'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}:
      patch:
        tags: [Hijos]
        summary: Actualizar datos de un hijo
        parameters:
          - $ref: '#/components/parameters/ChildId'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildUpdateRequest'
              example:
                fullName: Sofía María López
                grade: 6.º grado
        responses:
          '200':
            description: Perfil actualizado.
            content:
              application/json:
                example:
                  child:
                    id: cm7x1child001
                    fullName: Sofía María López
                    birthDate: '2015-03-14T00:00:00.000Z'
                    grade: 6.º grado
                    familyId: cm7x1family001
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
      delete:
        tags: [Hijos]
        summary: Eliminar un perfil de hijo y su cuenta vinculada
        parameters:
          - $ref: '#/components/parameters/ChildId'
        description: Puede responder 202 si algunos archivos privados siguen pendientes de eliminación.
        responses:
          '202':
            description: Perfil eliminado; hay archivos pendientes de borrado.
            content:
              application/json:
                example:
                  message: El perfil se eliminó. Algunos archivos privados siguen en cola de borrado y se volverán a intentar automáticamente.
          '204':
            description: Perfil eliminado correctamente.
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/subjects:
      get:
        tags: [Materias]
        summary: Listar las materias del catálogo
        responses:
          '200':
            description: Materias disponibles ordenadas por nombre.
            content:
              application/json:
                example:
                  subjects:
                    - id: cm7x1subject001
                      name: Ciencias
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '500':
            $ref: '#/components/responses/InternalServerError'
      post:
        tags: [Materias]
        summary: Agregar una materia al catálogo
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectRequest'
              example:
                name: Ciencias
        responses:
          '201':
            description: Materia creada.
            content:
              application/json:
                example:
                  subject:
                    id: cm7x1subject001
                    name: Ciencias
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '409':
            $ref: '#/components/responses/Conflict'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}/subjects:
      parameters:
        - $ref: '#/components/parameters/ChildId'
      get:
        tags: [Materias]
        summary: Listar las materias asignadas a un hijo
        responses:
          '200':
            description: Materias asignadas al perfil.
            content:
              application/json:
                example:
                  subjects:
                    - id: cm7x1subject001
                      name: Ciencias
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
      post:
        tags: [Materias]
        summary: Asignar una materia a un hijo
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectRequest'
              example:
                name: Ciencias
        responses:
          '201':
            description: Materia asignada (o creada si no estaba en el catálogo).
            content:
              application/json:
                example:
                  subject:
                    id: cm7x1subject001
                    name: Ciencias
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}/subjects/{subjectId}:
      delete:
        tags: [Materias]
        summary: Quitar una materia de un hijo
        parameters:
          - $ref: '#/components/parameters/ChildId'
          - $ref: '#/components/parameters/SubjectId'
        responses:
          '204':
            description: Materia desasignada.
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}/schedules:
      parameters:
        - $ref: '#/components/parameters/ChildId'
      get:
        tags: [Horarios]
        summary: Listar el horario de un hijo
        responses:
          '200':
            description: Bloques de horario ordenados por día y hora.
            content:
              application/json:
                example:
                  schedules:
                    - id: cm7x1schedule001
                      childId: cm7x1child001
                      subjectId: cm7x1subject001
                      dayOfWeek: monday
                      startTime: '16:00'
                      endTime: '17:00'
                      subject:
                        id: cm7x1subject001
                        name: Ciencias
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
      post:
        tags: [Horarios]
        summary: Crear un bloque de horario
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleRequest'
              example:
                subjectId: cm7x1subject001
                dayOfWeek: monday
                startTime: '16:00'
                endTime: '17:00'
        responses:
          '201':
            description: Bloque de horario creado.
            content:
              application/json:
                example:
                  schedule:
                    id: cm7x1schedule001
                    childId: cm7x1child001
                    subjectId: cm7x1subject001
                    dayOfWeek: monday
                    startTime: '16:00'
                    endTime: '17:00'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}/schedules/{scheduleId}:
      parameters:
        - $ref: '#/components/parameters/ChildId'
        - $ref: '#/components/parameters/ScheduleId'
      patch:
        tags: [Horarios]
        summary: Actualizar un bloque de horario
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleRequest'
              example:
                subjectId: cm7x1subject001
                dayOfWeek: tuesday
                startTime: '16:30'
                endTime: '17:30'
        responses:
          '200':
            description: Bloque actualizado.
            content:
              application/json:
                example:
                  schedule:
                    id: cm7x1schedule001
                    childId: cm7x1child001
                    subjectId: cm7x1subject001
                    dayOfWeek: tuesday
                    startTime: '16:30'
                    endTime: '17:30'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
      delete:
        tags: [Horarios]
        summary: Eliminar un bloque de horario
        responses:
          '204':
            description: Bloque eliminado.
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'

    /api/families/me/children/{childId}/tasks:
      parameters:
        - $ref: '#/components/parameters/ChildId'
      get:
        tags: [Tareas]
        summary: Listar las tareas asignadas a un hijo
        responses:
          '200':
            description: Tareas con materia, adjuntos e indicador de cuestionario.
            content:
              application/json:
                example:
                  tasks:
                    - id: cm7x1task001
                      title: Lectura de ciencias
                      description: Leer el capítulo sobre los ecosistemas.
                      type: reading
                      status: pending
                      dueAt: '2026-11-20T23:59:00.000Z'
                      isQuiz: true
                      readingContent: Lee el texto sobre los ecosistemas.
                      attachments: []
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '500':
            $ref: '#/components/responses/InternalServerError'
      post:
        tags: [Tareas]
        summary: Crear una tarea para un hijo
        description: Si `createQuiz` es true o `type` es `reading`, genera preguntas; en ese caso se requiere `subjectId`.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreateRequest'
              example:
                subjectId: cm7x1subject001
                title: Lectura de ciencias
                description: Leer el capítulo sobre los ecosistemas.
                type: reading
                dueAt: '2026-11-20T23:59:00.000Z'
        responses:
          '201':
            description: Tarea creada.
            content:
              application/json:
                example:
                  task:
                    id: cm7x1task001
                    title: Lectura de ciencias
